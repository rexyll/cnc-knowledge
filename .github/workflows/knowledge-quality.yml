      - name: Persist RK4 and ENE simulation results to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.rk4_archive_check.outputs.changed == 'true' || steps.rk4_02_archive_check.outputs.changed == 'true' || steps.rk4_03_archive_check.outputs.changed == 'true' || steps.rk4_04_archive_check.outputs.changed == 'true' || steps.ene_01_archive_check.outputs.changed == 'true' || steps.ene_02_archive_check.outputs.changed == 'true' || steps.ene_03_archive_check.outputs.changed == 'true' || steps.path_01_archive_check.outputs.changed == 'true')
