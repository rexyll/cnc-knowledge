name: Knowledge Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Knowledge structure and data quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run repository knowledge lint
        run: python scripts/knowledge_lint.py --strict

  ch12-resource-tests:
    name: CH12 numerical resource tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install resource-test dependency
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3"
      - name: Run CH12 solver, PATH-01, ENE, and RK4 screen resource tests
        run: python -m unittest discover -s resouces/12-control-and-machining-algorithms -p 'test_gantry_joint_drive_*.py' -v
      - name: Run RK4-01 synthetic convergence screen
        run: |
          python resouces/12-control-and-machining-algorithms/gantry_joint_drive_rk4_screen.py \\
            --config resouces/12-control-and-machining-algorithms/gantry-joint-drive-rk4-01-synthetic-config.json \\
            --output-dir resouces/12-control-and-machining-algorithms/generated/rk4-01-synthetic
      - name: Upload RK4-01 numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch12-rk4-01-synthetic-${{ github.run_id }}
          path: resouces/12-control-and-machining-algorithms/generated/rk4-01-synthetic/
          if-no-files-found: warn
          retention-days: 14
