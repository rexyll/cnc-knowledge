name: Knowledge Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnc-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Knowledge structure and data quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run repository knowledge lint
        run: python scripts/knowledge_lint.py --strict

  ch12-resource-tests:
    name: CH12 numerical resource tests
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'refs/heads/main' || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install resource-test dependency
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3"
      - name: Run CH12 solver, PATH-01, ENE, and RK4 screen resource tests
        run: python -m unittest discover -s resouces/12-control-and-machining-algorithms -p 'test_gantry_joint_drive_*.py' -v
      - name: Run RK4-01 synthetic convergence screen
        id: rk4_screen
        run: python resouces/12-control-and-machining-algorithms/gantry_joint_drive_rk4_screen.py --config resouces/12-control-and-machining-algorithms/gantry-joint-drive-rk4-01-synthetic-config.json --output-dir resouces/12-control-and-machining-algorithms/generated/rk4-01-synthetic
      - name: Run RK4-02 positive free-path synthetic convergence screen
        id: rk4_02_screen
        run: python resouces/12-control-and-machining-algorithms/gantry_joint_drive_rk4_screen.py --config resouces/12-control-and-machining-algorithms/gantry-joint-drive-rk4-02-synthetic-config.json --output-dir resouces/12-control-and-machining-algorithms/generated/rk4-02-synthetic
      - name: Run RK4-03 negative free-path synthetic convergence screen
        id: rk4_03_screen
        run: python resouces/12-control-and-machining-algorithms/gantry_joint_drive_rk4_screen.py --config resouces/12-control-and-machining-algorithms/gantry-joint-drive-rk4-03-synthetic-config.json --output-dir resouces/12-control-and-machining-algorithms/generated/rk4-03-synthetic
      - name: Run RK4-04 loaded mixed-sign coupled-state synthetic convergence screen
        id: rk4_04_screen
        run: python resouces/12-control-and-machining-algorithms/gantry_joint_drive_rk4_screen.py --config resouces/12-control-and-machining-algorithms/gantry-joint-drive-rk4-04-synthetic-config.json --output-dir resouces/12-control-and-machining-algorithms/generated/rk4-04-synthetic
      - name: Run ENE-01 synthetic ideal one-port energy-closure integration
        id: ene_01_screen
        run: rm -rf resouces/12-control-and-machining-algorithms/generated/ene-01-synthetic && python resouces/12-control-and-machining-algorithms/gantry_joint_drive_energy_closure.py --config resouces/12-control-and-machining-algorithms/gantry-joint-drive-ene-01-synthetic-config.json --output-dir resouces/12-control-and-machining-algorithms/generated/ene-01-synthetic
      - name: Run ENE-02 synthetic dissipative energy-closure integration
        id: ene_02_screen
        run: rm -rf resouces/12-control-and-machining-algorithms/generated/ene-02-synthetic && python resouces/12-control-and-machining-algorithms/gantry_joint_drive_energy_closure.py --config resouces/12-control-and-machining-algorithms/gantry-joint-drive-ene-02-synthetic-config.json --output-dir resouces/12-control-and-machining-algorithms/generated/ene-02-synthetic
      - name: Run ENE-03 synthetic external-generalized-work energy-closure integration
        id: ene_03_screen
        run: rm -rf resouces/12-control-and-machining-algorithms/generated/ene-03-synthetic && python resouces/12-control-and-machining-algorithms/gantry_joint_drive_energy_closure.py --config resouces/12-control-and-machining-algorithms/gantry-joint-drive-ene-03-synthetic-config.json --output-dir resouces/12-control-and-machining-algorithms/generated/ene-03-synthetic
      - name: Run PATH-01 synthetic free versus prescribed path comparison
        id: path_01_screen
        run: rm -rf resouces/12-control-and-machining-algorithms/generated/path-01-synthetic && python resouces/12-control-and-machining-algorithms/gantry_joint_drive_path_comparison.py --config resouces/12-control-and-machining-algorithms/gantry-joint-drive-path-01-synthetic-config.json --output-dir resouces/12-control-and-machining-algorithms/generated/path-01-synthetic
      - name: Check whether RK4-03 source inputs changed
        id: rk4_03_archive_check
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest_path = "resouces/12-control-and-machining-algorithms/generated/rk4-03-synthetic/rk4-03-run-manifest.json"
          try:
              previous_text = subprocess.check_output(
                  ["git", "show", f"HEAD:{manifest_path}"], text=True
              )
              previous = json.loads(previous_text)
          except (subprocess.CalledProcessError, json.JSONDecodeError):
              previous = None

          current = json.loads(Path(manifest_path).read_text(encoding="utf-8"))
          inputs = ("config_sha256", "solver_sha256", "path_support_sha256", "runner_sha256")
          changed = previous is None or any(previous.get(key) != current.get(key) for key in inputs)
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
          print("RK4-03 model/runner/config input changed:", changed)
          PY
      - name: Upload RK4-03 numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch12-rk4-03-negative-free-path-synthetic-${{ github.run_id }}
          path: resouces/12-control-and-machining-algorithms/generated/rk4-03-synthetic/
          if-no-files-found: warn
          retention-days: 14
      - name: Check whether RK4-04 source inputs changed
