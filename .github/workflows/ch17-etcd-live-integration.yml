name: CH17 etcd live integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ch17-etcd-live-integration.yml"
      - "scripts/spare_parts_provider_etcd3gw_driver.py"
      - "scripts/spare_parts_provider_authority_store.py"
      - "scripts/etcd-integration/**"
      - "tests/test_*etcd_integration.py"
      - "requirements-ch17-etcd-integration.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  etcd-live-integration:
    name: Disposable three-member etcd v3.7.0 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Run live etcd integration tests
        id: integration
        env:
          ETCD_KEEP_CLUSTER: "1"
        run: bash scripts/etcd-integration/run.sh

      - name: Capture etcd diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ch17-etcd-live-integration"
          docker compose --project-name cnc-knowledge-etcd-itest \
            -f scripts/etcd-integration/compose.yaml ps --all \
            > "$RUNNER_TEMP/ch17-etcd-live-integration/compose-ps.txt" 2>&1 || true
          docker compose --project-name cnc-knowledge-etcd-itest \
            -f scripts/etcd-integration/compose.yaml logs --no-color \
            > "$RUNNER_TEMP/ch17-etcd-live-integration/etcd-cluster.log" 2>&1 || true

      - name: Remove disposable etcd cluster and volumes
        if: always()
        run: |
          docker compose --project-name cnc-knowledge-etcd-itest \
            -f scripts/etcd-integration/compose.yaml down -v --remove-orphans || true

      - name: Upload etcd integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch17-etcd-live-integration-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/ch17-etcd-live-integration/
          if-no-files-found: warn
          retention-days: 14
